name: Validate and build content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate-content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Run tests
        run: npm test
      - name: Build full site
        run: npm run build
      - name: Upload built site (preview artifact)
        uses: actions/upload-artifact@v4
        with:
          name: docia-dist-preview
          path: dist/
          retention-days: 7
          if-no-files-found: error
